<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nacho House | منوی دیجیتال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <span class="star s1">★</span>
      <span class="star s2">★</span>
      <span class="star s3">★</span>
      <h1 class="brand-title">NACHO HOUSE</h1>
    </div>
    <div class="brand-rule"></div>
    <p class="brand-tagline">GOOD FOOD, GOOD MOOD</p>
    <div class="checker"></div>
  </header>

  <main>
    <div class="intro">
      <p>یکی از منوها رو انتخاب کن</p>
    </div>

    <div class="choice-grid">
      <a href="food.html" class="choice-card food">
        <span class="choice-icon">🌮</span>
          <span class="icon-sparkles" aria-hidden="true">
            <span class="icon-sparkle sparkle-1">✦</span>
            <span class="icon-sparkle sparkle-2">✧</span>
            <span class="icon-sparkle sparkle-3">✦</span>
            <span class="icon-sparkle sparkle-4">·</span>
            <span class="icon-sparkle sparkle-5">✧</span>
            <span class="icon-sparkle sparkle-6">·</span>
            <span class="icon-sparkle sparkle-7">✦</span>
            <span class="icon-sparkle sparkle-8">✧</span>
          </span>
        <h2 class="choice-title">غذا</h2>
        <div class="choice-underline"></div>
        <p class="choice-desc">برگر، پاستا، ناچوز، سیب‌زمینی و سالاد</p>
      </a>

      <a href="drinks.html" class="choice-card drinks">
        <span class="choice-icon">🥤</span>
          <span class="icon-sparkles" aria-hidden="true">
            <span class="icon-sparkle sparkle-1">✦</span>
            <span class="icon-sparkle sparkle-2">✧</span>
            <span class="icon-sparkle sparkle-3">✦</span>
            <span class="icon-sparkle sparkle-4">·</span>
            <span class="icon-sparkle sparkle-5">✧</span>
            <span class="icon-sparkle sparkle-6">·</span>
            <span class="icon-sparkle sparkle-7">✦</span>
            <span class="icon-sparkle sparkle-8">✧</span>
          </span>
        <h2 class="choice-title">نوشیدنی</h2>
        <div class="choice-underline"></div>
        <p class="choice-desc">قهوه، نوشیدنی سرد و گرم، شیک و ماچا</p>
      </a>
    </div>
  </main>

  <footer>
    <div class="checker"></div>
    <p class="footer-line address">📍 شیراز، بلوار ...، خیابان ...</p>
    <p class="footer-line">☎ شماره تماس: ...</p>
    <p class="footer-line">📷 <a href="https://nachohouse.ir" target="_blank" rel="noopener">nachohouse.ir</a></p>
    <p class="footer-note">GOOD FOOD, GOOD MOOD</p>
  </footer>

</body>
</html>
